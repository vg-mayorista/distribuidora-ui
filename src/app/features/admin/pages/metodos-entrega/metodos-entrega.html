<div class="admin-page-container">
  <div class="page-header">
    <div class="page-header-text">
      <h1 class="page-header-title">Métodos de entrega</h1>
      <p class="page-header-subtitle">Configurá las opciones de envío y retiro que se ofrecen al cliente.</p>
    </div>
    <div class="page-header-actions">
      <div class="stock-search">
        <svg class="stock-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text"
               class="stock-search-input"
               placeholder="Buscar por nombre…"
               [ngModel]="filter()"
               (ngModelChange)="filter.set($event)"
               aria-label="Buscar métodos de entrega">
      </div>

      <label class="toggle-inactive">
        <input type="checkbox" [checked]="showInactive()" (change)="toggleShowInactive()">
        <span>Mostrar inactivos</span>
      </label>
    </div>
  </div>

  <div *ngIf="loading()" class="loading-state">
    <div class="spinner"></div>
    <p class="text-muted" style="margin-top: var(--space-md);">Cargando métodos…</p>
  </div>

  <div *ngIf="error() && !loading()" class="card" style="padding: var(--space-lg); border-color: var(--status-inactive-bg);">
    <p style="color: var(--status-inactive-text); margin: 0;">{{ error() }}</p>
  </div>

  <div *ngIf="!loading() && !error() && filtered().length === 0" class="card" style="padding: var(--space-xl);">
    <app-empty-state
      title="Sin métodos de entrega"
      message="Los métodos de entrega los crea el seeder al iniciar el backend. Si no ves ninguno, reinciá el backend para que se ejecute."
    >
    </app-empty-state>
  </div>

  <div *ngIf="!loading() && !error() && filtered().length > 0" class="data-table-wrapper">
    <div class="table-responsive">
    <table class="data-table">
      <thead>
        <tr>
          <th class="col-me-name">Nombre</th>
          <th class="text-right col-me-cost">Costo</th>
          <th class="col-me-status">Estado</th>
          <th class="text-right col-me-actions">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let m of filtered(); trackBy: trackById" [class.row-inactive]="!m.active">
          <td class="font-semibold">{{ m.name }}</td>
          <td class="text-right">${{ formatPrice(m.cost) }}</td>
          <td>
            <app-badge [variant]="m.active ? 'active' : 'inactive'">{{ m.active ? 'Activo' : 'Inactivo' }}</app-badge>
          </td>
          <td>
            <div class="actions-cell">
              <button class="btn-icon" type="button" (click)="openEdit(m)" title="Editar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              </button>
              <button *ngIf="m.active" class="btn-icon btn-icon--danger" type="button" (click)="toggleActive(m)" title="Desactivar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
              </button>
              <button *ngIf="!m.active" class="btn-icon" type="button" (click)="toggleActive(m)" title="Reactivar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

  <app-modal *ngIf="editMethod() as m" [open]="showEdit()"
    [title]="'Editar: ' + m.name" size="md" (close)="closeEdit()">
    <form (ngSubmit)="submitEdit()" class="me-form">
      <div class="form-group">
        <label class="form-label" for="em-name">
          Nombre
          <span class="readonly-hint">(identificador de sistema, no editable)</span>
        </label>
        <input id="em-name" type="text" class="form-input"
               [ngModel]="editForm().name"
               readonly
               name="emName" maxlength="100" required>
      </div>
      <div class="form-group">
        <label class="form-label form-label-required" for="em-cost">Costo</label>
        <input id="em-cost" type="number" min="0" step="0.01" class="form-input"
               [ngModel]="editForm().cost"
               (ngModelChange)="editForm.update(f => ({...f, cost: +$event}))"
               name="emCost" required>
      </div>
      <div *ngIf="editError()" class="form-error">{{ editError() }}</div>
      <div modal-footer style="display: flex; justify-content: flex-end; gap: var(--space-sm); margin-top: var(--space-lg);">
        <app-button variant="secondary" (onClick)="closeEdit()" [disabled]="editSaving()">Cancelar</app-button>
        <app-button variant="primary" type="submit" [loading]="editSaving()" [disabled]="editSaving()">Guardar cambios</app-button>
      </div>
    </form>
  </app-modal>
</div>
