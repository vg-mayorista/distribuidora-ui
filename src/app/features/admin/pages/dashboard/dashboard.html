<div class="admin-layout">
  
  <!-- ── Sidebar ──────────────────────────────── -->
  <aside class="admin-sidebar" [class.admin-sidebar--open]="sidebarOpen()">
    
    <!-- Brand -->
    <div class="sidebar-brand">
      <h1 class="sidebar-brand-name"><span class="brand-orange">VG</span> <span class="brand-mono">Mayorista</span></h1>
      <p class="sidebar-brand-role">Panel Admin</p>
    </div>

    <!-- Navigation -->
    <p class="sidebar-section-label">Navegación</p>
    <nav class="sidebar-nav">
      <a class="sidebar-link"
         routerLink="stock"
         routerLinkActive="sidebar-link--active"
         (click)="closeSidebarOnMobile()">
        <svg class="sidebar-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
          <line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
        <span>Stock</span>
      </a>

      <a class="sidebar-link"
         routerLink="categorias"
         routerLinkActive="sidebar-link--active"
         (click)="closeSidebarOnMobile()">
        <svg class="sidebar-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
        <span>Categorías</span>
      </a>

      <a class="sidebar-link"
         routerLink="ordenes"
         routerLinkActive="sidebar-link--active"
         (click)="closeSidebarOnMobile()">
        <svg class="sidebar-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="21" r="1"/>
          <circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        <span>Pedidos</span>
      </a>

      <a class="sidebar-link"
         routerLink="metodos-entrega"
         routerLinkActive="sidebar-link--active"
         (click)="closeSidebarOnMobile()">
        <svg class="sidebar-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="1" y="3" width="15" height="13"/>
          <path d="M16 8h4l3 3v5h-7V8z"/>
          <circle cx="5.5" cy="18.5" r="2.5"/>
          <circle cx="18.5" cy="18.5" r="2.5"/>
        </svg>
        <span>Métodos de entrega</span>
      </a>

      <a class="sidebar-link"
         routerLink="usuarios"
         routerLinkActive="sidebar-link--active"
         (click)="closeSidebarOnMobile()">
        <svg class="sidebar-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span>Usuarios</span>
      </a>

      <a class="sidebar-link"
         routerLink="reportes"
         routerLinkActive="sidebar-link--active"
         (click)="closeSidebarOnMobile()">
        <svg class="sidebar-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6" y1="20" x2="6" y2="14"/>
        </svg>
        <span>Reportes</span>
      </a>
    </nav>
    
    <!-- Footer -->
    <div class="sidebar-footer">
      <div class="sidebar-footer-links">
        <a class="sidebar-footer-link" routerLink="/" (click)="closeSidebar()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          Volver al inicio
        </a>
        <button class="sidebar-footer-link" type="button" (click)="onLogout()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Cerrar sesión
        </button>
      </div>
    </div>
  </aside>
  
  <!-- ── Sidebar Backdrop (mobile) ── -->
  <div class="admin-sidebar-backdrop" 
       *ngIf="sidebarOpen()"
       (click)="closeSidebar()"
       aria-hidden="true"></div>
  
  <!-- ── Topbar ──────────────────────────────── -->
  <header class="admin-topbar">
    <div class="topbar-left">
      <button class="topbar-hamburger" 
              type="button" 
              (click)="toggleSidebar()"
              aria-label="Abrir menú">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>
    
    <div class="topbar-center">
      <app-topbar-search></app-topbar-search>
    </div>
    
    <div class="topbar-right">
      <!-- User info -->
      <div class="topbar-user-info" *ngIf="currentUser">
        <span class="topbar-user-name">{{ currentUser.firstName }} {{ currentUser.lastName }}</span>
        <div class="topbar-avatar-placeholder" aria-label="Usuario admin">
          {{ currentUser.firstName.charAt(0) }}{{ currentUser.lastName.charAt(0) }}
        </div>
      </div>
    </div>
  </header>
  
  <!-- ── Main Content ────────────────────────── -->
  <main class="admin-main">
    <router-outlet></router-outlet>
  </main>
  
</div>
