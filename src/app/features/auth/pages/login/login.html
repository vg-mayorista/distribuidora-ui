<div class="auth-page">
  <a class="auth-back" routerLink="/">← Inicio</a>

  <div class="auth-card">
    <h1 class="auth-brand">
      <img src="favicon.png" alt="VG Logo" class="auth-brand-logo" />
      <span><span class="brand-v">V</span><span class="brand-g">G</span> <span>Mayorista</span></span>
    </h1>
    <p class="auth-subtitle">Iniciá sesión para gestionar tus pedidos</p>

    <div *ngIf="errorMsg" class="auth-error">{{ errorMsg }}</div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input id="email" type="email" name="email"
               class="form-input" autocomplete="email"
               [(ngModel)]="credentials.email" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <div class="password-wrapper">
          <input id="password"
                 [type]="showPassword ? 'text' : 'password'"
                 name="password"
                 class="form-input" autocomplete="current-password"
                 [(ngModel)]="credentials.password" required />
          <button type="button" class="toggle-password" (click)="togglePassword()" tabindex="-1">
            {{ showPassword ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" [disabled]="loading" style="margin-top: 1rem;">
        {{ loading ? 'Ingresando…' : 'Ingresar' }}
      </button>
    </form>

    <p class="auth-footer">
      ¿No tenés cuenta? <a routerLink="/register">Crear cuenta</a>
    </p>
  </div>
</div>
